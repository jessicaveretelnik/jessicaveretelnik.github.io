name: Checkout pricing tests
on:
  push:
    branches: [feature/book-cart-v1]
    paths:
      - 'backend/**'
      - '.github/workflows/checkout-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/checkout-tests.yml'
  workflow_dispatch:
jobs:
  pricing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run pricing and shipping tests
        run: npm test
